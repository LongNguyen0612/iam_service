# IAM Service Docker Configuration (uses container names)
DB_URI: "postgresql+asyncpg://postgres:postgres@iam_postgres:5432/iam_service"
MIGRATION_DB_URI: "postgresql://postgres:postgres@iam_postgres:5432/iam_service"
REDIS_URL: "redis://iam_redis:6379/0"
CACHE_BACKEND: "redis"
CORS_ORIGINS: ["http://localhost:3000"]
API_PREFIX: "/api"
API_PORT: 8000
API_HOST: "0.0.0.0"
CORS_ALLOW_CREDENTIALS: true
LOG_LEVEL: "INFO"
ENABLE_LOGGING_MIDDLEWARE: 1
AUTH_DISABLED: false
ENABLE_SENTRY: 0
DSN_SENTRY: ""
SENTRY_ENVIRONMENT: "dev"
JWT_SECRET: "dev-secret-key-change-in-production"
ADMIN_API_KEY: "test-admin-key-12345"
